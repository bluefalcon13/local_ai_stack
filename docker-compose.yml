services:
    code-assistant:
        container_name: code-assistant
        image: rocm/vllm:rocm10.1.0_ubuntu24.04_py3.14-pytorch_2.13.0_vllm-0.29.0
        restart: unless-stopped
        ipc: host
        security_opt:
            - seccomp=unconfined
        devices:
            - /dev/kfd:/dev/kfd
            - /dev/dri:/dev/dri
        group_add:
            - video
        ports:
            - "8000:8000"
        volumes:
            - ~/.cache/huggingface:/root/.cache/huggingface
        environment:
            - PYTORCH_TUNABLEOP_ENABLED=1
            - GPU_MAX_HW_QUEUES=1
            - HIP_FORCE_DEV_KERNARG=1
            - VLLM_SLEEP_WHEN_IDLE=1
            - FLASH_ATTENTION_TRITON_AMD_ENABLE=TRUE
        command: >
            vllm serve google/gemma-4-26B-A4B-it-qat-q4_0-unquantized
            --tensor-parallel-size 1
            --gpu-memory-utilization 0.95
            --max-model-len 262144
            --kv-cache-dtype fp8_e5m2
            --block-size 16
            --max-num-seqs 16
            --enable-auto-tool-choice
            --tool-call-parser gemma4
            --reasoning-parser gemma4
            --trust-remote-code
            --trust-request-chat-template
    onnx-worker:
        build: .
        container_name: arch-onnx-worker
        devices:
        - /dev/kfd
        - /dev/dri
        group_add:
        - video
        - render
        ipc: host
        cap_add:
        - SYS_PTRACE
        security_opt:
        - seccomp:unconfined
        environment:
        - HIP_FORCE_DEV_KERNARG=1
        volumes:
        - ./models:/workspace/models
        - ./scripts:/workspace/scripts
        command: python3 -c "import onnxruntime_genai as og; print('Containerized ONNX GenAI initialized successfully!')"