services:
    code-assistant:
        container_name: code-assistant
        image: rocm/vllm:rocm10.1.0_ubuntu24.04_py3.14-pytorch_2.13.0_vllm-0.29.0
        restart: unless-stopped
        ipc: host
        security_opt:
            - seccomp=unconfined
        devices:
            - /dev/kfd:/dev/kfd
            - /dev/dri:/dev/dri
        group_add:
            - video
        ports:
            - "8000:8000"
        volumes:
            - ~/.cache/huggingface:/root/.cache/huggingface
        environment:
            - PYTORCH_TUNABLEOP_ENABLED=1
            - GPU_MAX_HW_QUEUES=1
            - HIP_FORCE_DEV_KERNARG=1
            - VLLM_SLEEP_WHEN_IDLE=1
            - FLASH_ATTENTION_TRITON_AMD_ENABLE=TRUE
        command: >
            vllm serve google/gemma-4-26B-A4B-it-qat-q4_0-unquantized --tensor-parallel-size 1 --gpu-memory-utilization 0.95 --max-model-len 262144 --kv-cache-dtype fp8_e5m2 --block-size 16 --max-num-seqs 16 --enable-auto-tool-choice --tool-call-parser gemma4 --reasoning-parser gemma4 --trust-remote-code --trust-request-chat-template
    onnx-worker:
        build:
            context: ./onnx_docker
            dockerfile: Dockerfile.onnx
        container_name: arch-onnx-worker
        devices:
            - /dev/kfd
            - /dev/dri
        group_add:
            - video
            - render
        ipc: host
        cap_add:
            - SYS_PTRACE
        security_opt:
            - seccomp:unconfined
        ports:
            - "8001:8000"
        volumes:
            - /opt/rocm:/opt/rocm:ro
            - ~/.cache/huggingface:/root/.cache/huggingface
        environment:
            - ROCM_PATH=/opt/rocm
            - PATH=/opt/rocm/bin:$PATH
            - HIP_FORCE_DEV_KERNARG=1
    # Minimalist GoOrchestrator container (~13MB, FROM scratch, no ca-certs needed)
    orchestrator:
        build:
            context: ..
            dockerfile: builder/Dockerfile
        image: go-orchestrator:latest
        container_name: go-orchestrator
        networks:
            - internal-mesh
        ports:
            # Expose locally for debugging; omit if routing purely via cloudflared
            - "8080:8080"
        command:
            - "-port"
            - "8080"
            - "-mode"
            - "http"
            - "-lrm-url"
            - "http://code-assistant:8000" # Plain HTTP over internal network
            - "-worker-url"
            - "http://onnx-worker:8001" # Plain HTTP over internal network
        restart: unless-stopped
        depends_on:
            - code-assistant
            - onnx-worker
